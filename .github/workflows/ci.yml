name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup STruC++
        uses: Autonomy-Logic/setup-strucpp@v1

      - name: Verify installation
        run: strucpp --version

      - name: Compile all source files
        run: |
          mkdir -p build
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Interfaces/IControllable.st \
            src/Functions/TimingUtils.st \
            src/FunctionBlocks/TrafficLight.st \
            src/FunctionBlocks/PedestrianLight.st \
            src/FunctionBlocks/TurnSignalLight.st \
            src/FunctionBlocks/VehicleDetector.st \
            src/FunctionBlocks/TrafficLogger.st \
            src/Programs/IntersectionController.st \
            -o build/intersection.cpp

      - name: Run data type tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            --test tests/test_data_types.st

      - name: Run traffic light tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Interfaces/IControllable.st \
            src/FunctionBlocks/TrafficLight.st \
            --test tests/test_traffic_light.st

      - name: Run pedestrian light tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Interfaces/IControllable.st \
            src/FunctionBlocks/TrafficLight.st \
            src/FunctionBlocks/PedestrianLight.st \
            --test tests/test_pedestrian_light.st

      - name: Run timing utils tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Functions/TimingUtils.st \
            --test tests/test_timing_utils.st

      - name: Run vehicle detector tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/FunctionBlocks/VehicleDetector.st \
            --test tests/test_vehicle_detector.st

      - name: Run traffic logger tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/FunctionBlocks/TrafficLogger.st \
            --test tests/test_traffic_logger.st

      - name: Run night mode tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Interfaces/IControllable.st \
            src/FunctionBlocks/TrafficLight.st \
            --test tests/test_night_mode.st

      - name: Run interface tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Interfaces/IControllable.st \
            src/FunctionBlocks/TrafficLight.st \
            --test tests/test_interface.st

      - name: Run turn signal tests
        run: |
          strucpp \
            src/DataTypes/TrafficTypes.st \
            src/Interfaces/IControllable.st \
            src/FunctionBlocks/TrafficLight.st \
            src/FunctionBlocks/TurnSignalLight.st \
            --test tests/test_turn_signal.st
