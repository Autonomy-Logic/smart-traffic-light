name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup STruC++
        uses: Autonomy-Logic/setup-strucpp@v1

      - name: Verify installation
        run: strucpp --version
